name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # v1
        with:
          ruby-version: '4.0.6'
          bundler-cache: true
      - name: Config loads cleanly
        run: bundle exec rubocop --config rubocop.yml --show-cops > /dev/null
      - name: Dogfood the config on this repo
        run: bundle exec rubocop
      - name: Config-behavior spec
        run: bundle exec rspec
