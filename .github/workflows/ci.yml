name: ci

# Bare `push`: a pull_request trigger stops running entirely once GitHub marks
# a PR CONFLICTING, and carrying both would double-run every PR. See infra's
# docs/ci-standard.md.
# `branches: ['**']` rather than a filterless `push`: that also fires on tag
# pushes, so every release tag would run the whole suite against a ref that is
# not a deployable app state. `tags-ignore` is NOT the alternative -- with no
# branch filter present GitHub runs the workflow on no branch push at all.
on:
  push:
    branches: ['**']

# Guarded rather than a plain `true`: a default-branch run is the one that
# establishes whether main is green. See infra's docs/ci-standard.md.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1
        with:
          # From .ruby-version, which already pins 4.0.6, rather than a second
          # copy of that value here. Dependabot's github-actions ecosystem
          # bumps `uses:` refs and never input values, so a literal is the one
          # pin nothing ever moves.
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Config loads cleanly
        run: bundle exec rubocop --config rubocop.yml --show-cops > /dev/null
      - name: Dogfood the config on this repo
        run: bundle exec rubocop
      - name: Config-behavior spec
        run: bundle exec rspec
