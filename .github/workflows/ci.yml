name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '4.0.6'
          bundler-cache: true
      - name: Config loads cleanly
        run: bundle exec rubocop --config rubocop.yml --show-cops > /dev/null
      - name: Dogfood the config on this repo
        run: bundle exec rubocop
      - name: Config-behavior spec
        run: bundle exec rspec
